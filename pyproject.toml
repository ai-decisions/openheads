[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openheads"
version = "0.1.0"
description = "Training code for a graph-based financial-crime detector: GraphSAGE encoder with per-chain normalisation, warm-start backbone training recipe, per-chain scoring-head training, population-quantile threshold calibration, a public-source label-set builder, and a reproducible legacy path on the public Elliptic benchmark."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AI DECISIONS", email = "opensource@aidecisions.ai" }]
keywords = [
    "graph-neural-network",
    "graphsage",
    "financial-crime",
    "aml",
    "anti-money-laundering",
    "blockchain",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Every entry below is imported at module level by a shipped module, so a
# bare `pip install openheads` has to carry it. The list was derived by
# grepping the actual imports of the shipped tree, not by intent: a
# dependency list written from memory is how a documented install command
# ends up failing on the first import.
#   numpy, torch       - everywhere
#   torch_geometric    - models.py (SAGEConv/GATConv), data_prep, bridge, trainer
#   structlog          - logging in every module
#   pandas             - ai_agent_features.py, feature_pipeline.py
#   networkx           - bridge.py, data_prep.py, synthetic.py
#   scikit-learn       - heads.recall_at_fpr (the metric every trainer reports)
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "structlog>=24",
    "pandas>=2.0",
    "networkx>=3.2",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Reading training inputs from object storage you configure. The core
# package never requires it: the synthetic smoke and the Elliptic legacy
# path run without any warehouse.
warehouse = ["boto3>=1.34", "pyarrow>=15"]
# Neighbour sampling and the CSR graph need a compiled backend whose wheel
# must match your torch build, which a plain `pip install` cannot guarantee —
# so it is an extra, and the real-data path fails with a precise message
# instead of an ImportError deep inside a sampler.
sampling = ["torch-sparse>=0.6.18"]
# The Lightning-based legacy trainer (`openheads.trainer`) imports these at
# module level; the current backbone scripts do not use it.
legacy-trainer = ["pytorch-lightning>=2.2", "torchmetrics>=1.3", "optuna>=3.6"]
# Clustering utilities in `openheads.community_analysis` (imported lazily,
# inside the functions that need them).
cluster = ["hdbscan>=0.8.33", "scikit-learn>=1.4"]
# `openheads.download_elliptic` fetches the public benchmark at run time
# (lazy import, so the package installs without it).
elliptic = ["kagglehub>=0.3"]
# Everything the test suite touches, so `pip install -e .[dev]` is enough to
# run `pytest` green — no test is silently skipped for a missing dependency.
dev = [
    "pytest>=8",
    "ruff>=0.4",
    # pyarrow is a TEST dependency, not only a warehouse one: the label-set
    # tests import the builder, which reads parquet. Leaving it out of [dev]
    # made `pip install -e .[dev] && pytest` fail while CI passed, because CI
    # installed [warehouse,dev] and masked the gap.
    "pyarrow>=15",
    "pytorch-lightning>=2.2",
    "torchmetrics>=1.3",
    "optuna>=3.6",
    "hdbscan>=0.8.33",
    "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/ai-decisions/openheads"
Issues = "https://github.com/ai-decisions/openheads/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",
    # UP017 rewrites datetime.timezone.utc -> datetime.UTC, a 3.11-only alias.
    # Training runs on managed GPU images that still ship 3.10; an autofix
    # here would silently break those runtimes.
    "UP017",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
